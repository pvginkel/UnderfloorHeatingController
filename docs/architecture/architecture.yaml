schemaVersion: "0.1"
producer: underfloor-heating-controller

# Underfloor Heating Controller — ESP32-S3 firmware driving a circulation-pump
# relay and up to 12 zone relays, exposing each zone as an MQTT switch and the
# current draw as an MQTT sensor. Room layout is delivered in the IoT Support
# device config (app data, not a provider address).
#
# This repo introduces the FIRMWARE, not the physical device (registered in IoT
# Support, generated as a device: instance there). Three units exist. Universal
# esp-mdm platform edges only. NVS-provisioned addresses → no boundBy.

systemSoftware:
  - id: ss:underfloor-heating-controller,682de51a-d76e-4507-9eed-627725247303
    label: Underfloor Heating Controller firmware
    summary: >-
      ESP-IDF firmware (ESP32-S3) controlling a pump relay and up to 12 heating
      zones, surfaced as MQTT switches plus a current sensor; managed over the
      air by IoT Support.
    introduced: 2024-12-14
    lifecycle: active
    stereotype: SoftwareProduct
    sourceRepository: git:pvginkel/UnderfloorHeatingController
    stats:
      mcu: esp32-s3

